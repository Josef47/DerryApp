name: derry_app
description: "Household management app for housemates."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.8.0
  cloud_firestore: ^6.4.0
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5

  # State & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  # Persistence
  shared_preferences: ^2.3.5

  # Media
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.8

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
